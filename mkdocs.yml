site_name: Predictive-Process Penalized Transformation Models
site_dir: site

theme:
  variant: modern
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.sections
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - pymdownx.highlight:
      use_pygments: true
      pygments_lang_class: true
  - pymdownx.superfences

extra_css:
  - css/code_select.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            annotations_path: brief
            docstring_style: numpy
            heading_level: 3
            members: false
            separate_signature: true
            show_root_full_path: true
            show_root_heading: true
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true

nav:
  - Home: index.md
  - API reference:
      - api/index.md
      - Marginal model:
          - Model: api/model.md
          - "Parametric part: G": api/parametric.md
          - "Spline part: H": api/spline.md
      - Locations: api/locations.md
      - Gaussian processes: api/gaussian-processes.md
      - Composite model: api/composite.md
      - Data and plotting: api/data.md
