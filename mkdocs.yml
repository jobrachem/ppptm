site_name: Predictive-Process Penalized Transformation Models

theme:
  name: material
  features:
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      use_pygments: true
      pygments_lang_class: true
  - pymdownx.superfences

extra_css:
  - css/code_select.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            annotations_path: brief
            docstring_style: numpy
            heading_level: 3
            members: false
            separate_signature: true
            show_root_full_path: true
            show_root_heading: true
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true

nav:
  - Home: index.md
  - API reference: api.md
