[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "ppptm"
# version is read dynamically from ppptm/__about__.py
dynamic = ["version"]
description = "Penalized Transformation Models with Projected Process Gaussian Processes"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.13,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Johannes Brachem" }]
keywords = ["statistics", "machine-learning"]
urls = { Homepage = "https://github.com/jobrachem/ppptm" }

classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
]

dependencies = [
    "liesel",
    "liesel-ptm",
    "batram @ git+https://github.com/katzfuss-group/batram.git",
    "plotnine"
]

[dependency-groups]
r = [
    "rpy2",
]
dev = [
    "build",
    "black",
    "flake8",
    "isort",
    "mypy",
    "pdoc",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pyupgrade",
    "plotnine",
    "ipykernel",
    "ruff>=0.16.2",
]
docs = [
    "mkdocstrings[python]>=1.0.6",
    "zensical>=0.0.53",
]

# Hatch configuration to pull the version from ppptm/__about__.py
[tool.hatch.version]
path = "src/ppptm/__about__.py"

# If you need to include only specific packages (optional; hatch auto-discovers by default)
# [tool.hatch.build.targets.wheel]
# packages = ["ppptm"]

[tool.isort]
profile = "black"
py_version = "3.13"

[tool.flake8]
# make flake8 compatible with black
per-file-ignores = ["__init__.py:F401"]
max-line-length = 90
extend-ignore = ["E203"]

[tool.pytest.ini_options]
addopts = ["--doctest-glob=*.md"]
filterwarnings = [
    "ignore:.*`product` is deprecated:DeprecationWarning",
    "ignore:.*jax.core.Shape is deprecated:DeprecationWarning",
    "ignore:.*Accessing jax.config via the jax.config submodule is deprecated:DeprecationWarning",
]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
files = ["src/ppptm", "tests"]
ignore_missing_imports = true
scripts_are_modules = true
disable_error_code = "annotation-unchecked"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
liesel-ptm = { path = "../liesel-ptm", editable = true }
liesel = { path = "../liesel", editable = true }
